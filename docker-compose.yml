# Production-like stack.
# Prerequisite: copy backend/.env.example to backend/.env and fill all required values.
# Start:    docker compose up --build
# Detached: docker compose up --build -d
# Stop:     docker compose down
# Access:   frontend http://localhost:3000 | API docs http://localhost:8000/docs
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Secrets and service URLs are loaded at runtime, not declared in Compose.
    env_file:
      - ./backend/.env
    # Allows a container to reach Langflow running on the host. For a containerized
    # Langflow service, point LANGFLOW_API_URL to its Compose service name instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Compose DNS resolves "backend" from the Next.js server container.
      BACKEND_URL: http://backend:8000
    # Do not start the frontend until the backend healthcheck succeeds.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

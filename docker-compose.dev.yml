
# docker-compose.dev.yml — Development stack with live reload
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# How hot-reload works:
#   • Backend  — uvicorn --reload watches /app (bind-mounted from ./backend).
#                Edit any .py file on the host → uvicorn restarts automatically.
#   • Frontend — Next.js dev server (npm run dev) with HMR.
#                Edit any .tsx/.ts/.css file on the host → browser hot-reloads.
#
# node_modules isolation:
#   The anonymous volume `frontend_nm` shadows ./frontend/node_modules inside
#   the container so the host folder is never used or overwritten.

services:

  # ── FastAPI backend — auto-reload via uvicorn --reload ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Mount source code so uvicorn --reload picks up every file change.
    volumes:
      - ./backend:/app
    # Allow backend to reach Langflow running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Next.js frontend — HMR via npm run dev ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      # Tell Next.js dev server to accept connections from all hosts inside Docker.
      HOSTNAME: "0.0.0.0"
    volumes:
      # Bind-mount source so HMR sees every file change on the host.
      - ./frontend:/app
      # Isolate node_modules: container's copy wins over the host bind-mount.
      - frontend_nm:/app/node_modules
      # Persist the Next.js build cache across restarts for faster rebuilds.
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Anonymous volume that keeps node_modules inside the container only.
  frontend_nm:
  # Named volume for Next.js incremental build cache (speeds up HMR cold-start).
  frontend_next:

# Development stack with backend auto-reload and frontend HMR.
# Prerequisite: copy backend/.env.example to backend/.env and fill all required values.
# Start: docker compose -f docker-compose.dev.yml up --build
# Stop:  docker compose -f docker-compose.dev.yml down
# Access: frontend http://localhost:3000 | API docs http://localhost:8000/docs
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Bind-mount source so uvicorn --reload sees host-side Python changes.
    volumes:
      - ./backend:/app
    # Allows the backend to reach Langflow running on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      HOSTNAME: "0.0.0.0"
      # Polling makes bind-mounted file changes reliable on Docker Desktop
      # for Windows/macOS, where native filesystem events may be missed.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    volumes:
      # Application source for Next.js hot module replacement.
      - ./frontend:/app
      # Keep Linux container dependencies separate from host node_modules.
      - frontend_nm:/app/node_modules
      # Persist the Next.js incremental cache between container restarts.
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_nm:
  frontend_next:
